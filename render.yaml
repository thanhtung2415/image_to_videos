services:
  - type: web
    name: image-to-videos-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: QUEUE_MODE
        value: redis
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_MINIMAX_VIDEO_VERSION
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock

  - type: worker
    name: image-to-videos-worker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run worker --workspace apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: QUEUE_MODE
        value: redis
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_MINIMAX_VIDEO_VERSION
        sync: false
      - key: FAL_API_KEY
        sync: false
